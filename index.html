};

const money = n => '₪' + Math.round(n||0).toLocaleString('he-IL');
const store = {
  get:(k,d)=>{ try{ const v=localStorage.getItem(k); return v?JSON.parse(v):d }catch{ return d } },
  set:(k,v)=>{ try{ localStorage.setItem(k,JSON.stringify(v)) }catch{} }
};

async function fetchT(url, opt, ms=20000){
  let t;
  const timeout = new Promise((_,rej)=>{ t = setTimeout(()=>rej(new Error('הבקשה לשרת לקחה יותר מדי זמן')), ms); });
  try { return await Promise.race([fetch(url, opt), timeout]); } finally { clearTimeout(t); }
}
async function apiGet(m,y){
  const r = await fetchT(`${URL_API}?action=get&month=${m}&year=${y}`, undefined, 60000);
  const txt = await r.text();
  let j;
  try{ j = JSON.parse(txt); }catch{ throw new Error('תגובה לא תקינה מהשרת: '+txt.slice(0,80)); }
  if(j.status!=='success') throw new Error('השרת החזיר: '+(j.message||j.status||'שגיאה'));
  return j.data||[];
}
const apiPost = body => fetchT(URL_API,{method:'POST',body:JSON.stringify(body),headers:{'Content-Type':'text/plain;charset=utf-8'}});

const norm = s => String(s||'').trim().toLowerCase();
const words = s => norm(s).split(/\s+/).filter(Boolean);
// התאמה לפי מילים שלמות (לא תת-מחרוזת), כדי למנוע ערבוב בין מנהלים
const inArea = (v,user) => {
  if(user.role!=='manager') return true;
  const rt=words(v.manager), mt=words(user.name);
  if(!rt.length) return false;
  if(mt.join(' ')==='אהוד מועלם' && rt.includes('אודי')) return true;
  return rt.every(t=>mt.includes(t)) || mt.every(t=>rt.includes(t));
};
const summarize = list => list.reduce((a,v)=>{
  if(v.st===NO) return a;
  const x=Number(v.amount)||0; a.total+=x; a.count++;
  if(v.st===DONE){a.done+=x;a.doneCount++} else {a.open+=x;a.openCount++}
  return a;
},{total:0,done:0,open:0,count:0,doneCount:0,openCount:0});
const groupBy = (list,key) => {
  const m={};
  list.forEach(v=>{const k=(key(v)||'ללא שם').trim(); (m[k]=m[k]||[]).push(v)});
  return Object.entries(m).map(([name,items])=>({name,...summarize(items)})).filter(g=>g.count>0).sort((a,b)=>b.open-a.open);
};

function Bar({pct,color='#9c7229'}){
  return <div className="h-2.5 rounded-full bg-slate-100 overflow-hidden"><div className="h-full rounded-full" style={{width:Math.min(100,pct)+'%',background:color}}/></div>;
}

function Dashboard({scoped,user,onPickManager}){
  const s = summarize(scoped);
  const pct = s.total ? s.done/s.total*100 : 0;
  const byAgency = groupBy(scoped, v=>v.agency);
  const byManager = user.role==='admin' ? groupBy(scoped, v=>v.manager) : [];
  const Row = ({g,onClick}) => (
    <div onClick={onClick} className={`py-3 border-b last:border-0 ${onClick?'cursor-pointer active:bg-slate-50':''}`}>
      <div className="flex justify-between items-baseline mb-1.5">
        <span className="font-bold text-[16px]">{g.name}</span>
        <span className="text-[15px] font-bold">{money(g.open)} <span className="text-slate-400 font-normal text-[13px]">פתוח</span></span>
      </div>
      <Bar pct={g.total?g.done/g.total*100:0} color="#10b981"/>
      <div className="flex justify-between text-[13px] text-slate-500 mt-1.5">
        <span>נמסרו {g.doneCount} מתוך {g.count}</span><span>{money(g.done)} מתוך {money(g.total)}</span>
      </div>
    </div>
  );
  return (
    <div className="space-y-3">
      <div className="bg-[#262626] text-white rounded-3xl p-5 shadow border-b-4 border-[#9c7229]">
        <div className="text-[14px] opacity-70">{user.role==='admin'?'כל האזורים':'האזור שלי'} · יתרה למסירה</div>
        <div className="text-[38px] font-black leading-tight" style={{color:'#f6d19c'}}>{money(s.open)}</div>
        <div className="mt-3"><Bar pct={pct} color="#10b981"/></div>
        <div className="flex justify-between text-[14px] mt-2 opacity-90">
          <span>נמסר {money(s.done)} ({Math.round(pct)}%)</span><span>סה"כ {money(s.total)}</span>
        </div>
      </div>
      <div className="grid grid-cols-2 gap-3">
        <div className="bg-white rounded-2xl p-4 border-b-4 border-amber-400 text-center shadow-sm">
          <div className="text-[30px] font-black">{s.openCount}</div><div className="text-[14px] text-slate-500">שוברים ממתינים</div>
        </div>
        <div className="bg-white rounded-2xl p-4 border-b-4 border-emerald-500 text-center shadow-sm">
          <div className="text-[30px] font-black">{s.doneCount}</div><div className="text-[14px] text-slate-500">שוברים שנמסרו</div>
        </div>
      </div>
      {user.role==='admin' && byManager.length>0 && (
        <div className="bg-white rounded-2xl p-4 shadow-sm border">
          <h3 className="font-extrabold text-[17px] mb-1">לפי מנהל אזור</h3>
          {byManager.map(g=><Row key={g.name} g={g} onClick={()=>onPickManager(g.name)}/>)}
        </div>
      )}
      <div className="bg-white rounded-2xl p-4 shadow-sm border">
        <h3 className="font-extrabold text-[17px] mb-1">לפי סוכנות</h3>
        {byAgency.length? byAgency.map(g=><Row key={g.name} g={g}/>) : <div className="text-slate-400 py-6 text-center">אין נתונים לחודש זה</div>}
      </div>
    </div>
  );
}

function App(){
  const [user,setUser] = useState(()=>store.get('v_user',null));
  const [data,setData] = useState([]);
  const [loading,setLoading] = useState(false);
  const [loadErr,setLoadErr] = useState(false);
  const [updatedAt,setUpdatedAt] = useState(null);
  const [online,setOnline] = useState(navigator.onLine);
  const [toast,setToast] = useState(null);
  const [confirm,setConfirm] = useState(null);
  const [leaving,setLeaving] = useState(null);
  const [tab,setTab] = useState('dash');
  const [showDone,setShowDone] = useState(false);
  const now = new Date();
  const [m,setM] = useState(String(now.getMonth()+1).padStart(2,'0'));
  const [y,setY] = useState(String(now.getFullYear()));
  const [agency,setAgency] = useState('All');
  const [mgr,setMgr] = useState('All');
  const [q,setQ] = useState('');

  // תור עדכונים: id -> {status,month,year,state:'syncing'|'failed'}
  const [pend,setPend] = useState(()=>store.get('v_pending',{}));
  const pendRef = useRef(pend); pendRef.current = pend;
  const mRef = useRef(m), yRef = useRef(y); mRef.current=m; yRef.current=y;
  const changePend = fn => { const n=fn({...pendRef.current}); pendRef.current=n; setPend(n); store.set('v_pending',n); };
  const say = (text,bad) => { setToast({text,bad}); setTimeout(()=>setToast(null), bad?4500:2200); };

  const years = useMemo(()=>{const c=now.getFullYear();return [c-2,c-1,c,c+1].map(String)},[]);

  const load = useCallback(async (mm,yy,silent)=>{
    const key=`v_data_${mm}_${yy}`;
    if(!silent){ const c=sessionStorage.getItem(key); if(c) setData(JSON.parse(c)); else setLoading(true); }
    try{
      let rows;
      try{ rows = await apiGet(mm,yy); }catch(e1){ await sleep(1500); rows = await apiGet(mm,yy); }
      if(mRef.current===mm && yRef.current===yy){ setData(rows); setUpdatedAt(new Date()); setLoadErr(false); }
      try{sessionStorage.setItem(key,JSON.stringify(rows))}catch{}
    }catch(e){ console.error(e); setLoadErr(String((e&&e.message)||e)); }
    finally{ setLoading(false); }
  },[]);

  useEffect(()=>{ if(user) load(m,y); },[user,m,y]);

  // שליחה + אימות מול הגיליון. "הצלחה" רק אם השרת באמת מחזיר את הסטטוס החדש.
  const push = useCallback(async id=>{
    const p = pendRef.current[id]; if(!p) return;
    changePend(s=>({...s,[id]:{...p,state:'syncing'}}));
    let ok=false, fresh=null;
    try{
      await apiPost({action:'updateStatus',id,status:p.status,month:p.month,year:p.year});
      for(let i=0;i<4&&!ok;i++){
        await sleep(i?1500:700);
        const rows = await apiGet(p.month,p.year);
        const row = rows.find(r=>String(r.id)===String(id));
        if(row && row.status===p.status){ ok=true; fresh=rows; }
      }
    }catch(e){ console.error(e); }
    const cur = pendRef.current[id];
    if(!cur || cur.status!==p.status) return; // הוחלף בעדכון חדש יותר
    if(ok){
      if(mRef.current===p.month && yRef.current===p.year) setData(fresh);
      try{sessionStorage.setItem(`v_data_${p.month}_${p.year}`,JSON.stringify(fresh))}catch{}
      changePend(s=>{const n={...s};delete n[id];return n;});
      say('נשמר בגיליון ✓');
    }else{
      changePend(s=>({...s,[id]:{...p,state:'failed'}}));
      say('העדכון לא נשמר בגיליון. לחץ "נסה שוב" בשורה',true);
    }
  },[]);

  const act = (id,status)=>{
    changePend(s=>({...s,[id]:{status,month:m,year:y,state:'syncing'}}));
    if(user.role==='manager') setLeaving(id), setTimeout(()=>setLeaving(null),400);
    push(id);
  };

  // ניסיון חוזר אוטומטי: בכניסה ובחזרת חיבור
  useEffect(()=>{
    const retry=()=>{ setOnline(true); Object.keys(pendRef.current).forEach(id=>{ if(pendRef.current[id].state!=='syncing') push(id); }); };
    const off=()=>setOnline(false);
    window.addEventListener('online',retry); window.addEventListener('offline',off);
    if(user){ Object.keys(pendRef.current).forEach(id=>push(id)); }
    return ()=>{window.removeEventListener('online',retry);window.removeEventListener('offline',off)};
  },[user]);

  const rows = useMemo(()=>data.map(v=>({...v, st: pend[v.id]?.status ?? v.status, sync: pend[v.id]?.state})),[data,pend]);
  const scoped = useMemo(()=>rows.filter(v=>user&&inArea(v,user)),[rows,user]);
  const agencies = useMemo(()=>[...new Set(scoped.map(v=>v.agency).filter(Boolean))].sort(),[scoped]);
  const managers = useMemo(()=>[...new Set(scoped.map(v=>(v.manager||'').trim()).filter(Boolean))].sort(),[scoped]);

  const list = useMemo(()=>{
    const s=norm(q);
    return scoped.filter(v=>{
      if(user.role==='manager' && !showDone && !v.sync && (v.st===DONE||v.st===NO)) return false;
      if(agency!=='All' && v.agency!==agency) return false;
      if(mgr!=='All' && (v.manager||'').trim()!==mgr) return false;
      return !s || [v.agentName,v.agency,v.customerName,v.importer].some(f=>norm(f).includes(s));
    }).sort((a,b)=>{
      const w=x=>x==='נמסר'?1:x==='לא נותנים'?2:0;
      return w(a.st)-w(b.st) || (a.agency||'').localeCompare(b.agency||'','he');
    });
  },[scoped,agency,mgr,q,showDone,user]);

  const exportCsv = ()=>{
    const c=s=>`"${String(s??'').replace(/"/g,'""')}"`;
    let csv='לקוח,יבואן,סוכנות,סוכן,מנהל,סכום,סטטוס\n';
    list.forEach(v=>{csv+=[v.customerName,v.importer,v.agency,v.agentName,v.manager,v.amount,v.st||'ממתין'].map(c).join(',')+'\n'});
    const a=document.createElement('a');
    a.href=URL.createObjectURL(new Blob(['\ufeff'+csv],{type:'text/csv;charset=utf-8;'}));
    a.download=`דוח_שוברים_${m}_${y}.csv`; document.body.appendChild(a); a.click(); a.remove();
  };

  const login = u=>{ setUser(u); store.set('v_user',u); };
  const logout = ()=>{ localStorage.removeItem('v_user'); sessionStorage.clear(); setUser(null); setData([]); };

  if(!user) return <Login onLogin={login}/>;

  const pendCount = Object.keys(pend).length;
  const failedCount = Object.values(pend).filter(p=>p.state==='failed').length;

  return (
    <div className="min-h-screen pb-24 w-full">
      <nav className="bg-[#262626] text-white sticky top-0 z-40 border-b border-[#9c7229]/40 shadow-lg">
        <div className="max-w-3xl mx-auto px-4 py-3 flex justify-between items-center">
          <div>
            <Logo className="h-8 w-auto" lightMode={true}/>
            <span className="text-[13px] text-[#f6d19c] font-bold bg-[#9c7229]/25 px-2.5 py-0.5 rounded-md inline-block mt-1">{user.name}</span>
          </div>
          <div className="flex gap-1">
            <button aria-label="רענון" onClick={()=>load(m,y,true)} className="p-2.5 hover:bg-white/10 rounded-xl text-[#f6d19c]"><span className={loading?'spin inline-block':'inline-block'}>{Ic.refresh}</span></button>
            {user.role==='admin' && <button aria-label="ייצוא" onClick={exportCsv} className="p-2.5 hover:bg-white/10 rounded-xl text-[#f6d19c]">{Ic.dl}</button>}
            <button aria-label="התנתקות" onClick={logout} className="p-2.5 hover:bg-white/10 rounded-xl">{Ic.out}</button>
          </div>
        </div>
        {(!online||loadErr||pendCount>0) && (
          <div className={`text-center text-[14px] font-bold py-1.5 ${(!online||loadErr||failedCount)?'bg-red-600':'bg-amber-500 text-black'}`}>
            {!online ? 'אין חיבור לאינטרנט. עדכונים יישלחו כשהחיבור יחזור'
              : failedCount ? `${failedCount} עדכונים לא נשמרו בגיליון`
              : loadErr ? <span>טעינת הנתונים נכשלה <button className="underline mr-2" onClick={()=>load(m,y)}>נסה שוב</button><span className="block text-[12px] font-normal opacity-90 px-3">{String(loadErr)}</span></span>
              : `מסנכרן ${pendCount} עדכונים מול הגיליון...`}
          </div>
        )}
      </nav>

      <main className="max-w-3xl mx-auto p-3 space-y-3">
        <div className="bg-white rounded-2xl shadow-sm border p-3 flex gap-2">
          <select value={m} onChange={e=>setM(e.target.value)} className="bg-slate-50 border rounded-xl py-2.5 px-3 flex-1">
            {MONTHS.map((n,i)=><option key={i} value={String(i+1).padStart(2,'0')}>{n}</option>)}
          </select>
          <select value={y} onChange={e=>setY(e.target.value)} className="bg-slate-50 border rounded-xl py-2.5 px-3 w-28">
            {years.map(v=><option key={v}>{v}</option>)}
          </select>
        </div>

        <div className="grid grid-cols-2 bg-white rounded-2xl p-1 border shadow-sm text-[16px] font-bold">
          {[['dash','דשבורד'],['list','שוברים']].map(([k,n])=>(
            <button key={k} onClick={()=>setTab(k)} className={`py-2.5 rounded-xl transition ${tab===k?'bg-[#262626] text-[#f6d19c]':'text-slate-500'}`}>{n}</button>
          ))}
        </div>

        {tab==='dash' ? (
          loading && !data.length ? <Spinner/> :
          <Dashboard scoped={scoped} user={user} onPickManager={n=>{setMgr(n);setTab('list')}}/>
        ) : (
          <>
            <div className="bg-white rounded-2xl shadow-sm border p-3 space-y-2">
              <input value={q} onChange={e=>setQ(e.target.value)} placeholder="חיפוש לקוח, סוכן, סוכנות, יבואן..." className="w-full bg-slate-50 border rounded-xl px-4 py-3 outline-none"/>
              <div className="flex gap-2">
                <select value={agency} onChange={e=>setAgency(e.target.value)} className="bg-slate-50 border rounded-xl py-2.5 px-3 flex-1">
                  <option value="All">כל הסוכנויות</option>
                  {agencies.map(a=><option key={a}>{a}</option>)}
                </select>
                {user.role==='admin' && (
                  <select value={mgr} onChange={e=>setMgr(e.target.value)} className="bg-slate-50 border rounded-xl py-2.5 px-3 flex-1">
                    <option value="All">כל המנהלים</option>
                    {managers.map(a=><option key={a}>{a}</option>)}
                  </select>
                )}
              </div>
              {user.role==='manager' && (
                <label className="flex items-center gap-2 text-[15px] pt-1"><input type="checkbox" checked={showDone} onChange={e=>setShowDone(e.target.checked)} className="w-5 h-5"/> הצג גם שוברים שנמסרו</label>
              )}
            </div>

            {loading && !data.length ? <Spinner/> : (
              <div className="space-y-2">
                {list.map(v=>(
                  <div key={v.id} className={`rounded-2xl border p-3.5 flex items-center gap-3 shadow-sm ${leaving===v.id?'out':''} ${v.st===DONE?'bg-emerald-50 border-emerald-200':v.st===NO?'bg-red-50 border-red-200':'bg-white'}`}>
                    <div className="flex-1 min-w-0">
                      <div className="text-[17px] font-bold truncate">{v.customerName}</div>
                      <div className="text-[14px] text-slate-600 truncate">{v.agency}{v.importer?` | ${v.importer}`:''}</div>
                      <div className="text-[13px] text-slate-400 truncate">{v.agentName}{user.role==='admin'&&v.manager?` | ${v.manager}`:''}</div>
                      {v.sync==='syncing' && <div className="text-[13px] font-bold text-amber-600 mt-1">שומר בגיליון...</div>}
                      {v.sync==='failed' && <div className="text-[13px] font-bold text-red-600 mt-1">לא נשמר. <button className="underline" onClick={()=>push(v.id)}>נסה שוב</button></div>}
                    </div>
                    <div className="text-[19px] font-black whitespace-nowrap">{money(v.amount)}</div>
                    <div className="w-11 flex justify-center">
                      {v.st===DONE ? <span className="text-emerald-600">{Ic.check}</span>
                       : v.st===NO ? <span className="text-red-500 font-black text-lg">X</span>
                       : user.role==='admin'
                         ? <button aria-label="לא נותנים" onClick={()=>setConfirm({id:v.id,status:NO,v})} className="w-11 h-11 rounded-xl bg-slate-100 text-red-500 flex items-center justify-center active:scale-90">{Ic.trash}</button>
                         : <button aria-label="סמן כנמסר" onClick={()=>setConfirm({id:v.id,status:DONE,v})} className="w-11 h-11 rounded-xl bg-emerald-500 text-white flex items-center justify-center shadow active:scale-90">{Ic.check}</button>}
                    </div>
                  </div>
                ))}
                {!list.length && <div className="p-10 text-center text-slate-400 text-[16px]">אין שוברים להצגה</div>}
              </div>
            )}
          </>
        )}
        {updatedAt && <div className="text-center text-[13px] text-slate-400">עודכן לאחרונה: {updatedAt.toLocaleTimeString('he-IL',{hour:'2-digit',minute:'2-digit'})}</div>}
      </main>

      {confirm && (
        <div className="fixed inset-0 bg-black/50 z-[150] flex items-end sm:items-center justify-center p-4" onClick={()=>setConfirm(null)}>
          <div className="bg-white rounded-3xl p-6 w-full max-w-sm text-center" onClick={e=>e.stopPropagation()}>
            <div className="text-[19px] font-extrabold mb-1">{confirm.status===DONE?'לסמן כנמסר?':'לסמן "לא נותנים"?'}</div>
            <div className="text-[16px] text-slate-600 mb-5">{confirm.v.customerName} | {money(confirm.v.amount)}</div>
            <div className="flex gap-3">
              <button onClick={()=>setConfirm(null)} className="flex-1 py-3.5 rounded-xl bg-slate-100 font-bold text-[16px]">ביטול</button>
              <button onClick={()=>{act(confirm.id,confirm.status);setConfirm(null)}} className="flex-1 py-3.5 rounded-xl bg-[#262626] text-[#f6d19c] font-bold text-[16px]">אישור</button>
            </div>
          </div>
        </div>
      )}
      {toast && <div className={`fixed bottom-8 left-1/2 -translate-x-1/2 px-6 py-3 rounded-full shadow-xl text-[15px] font-bold z-[200] max-w-[92vw] text-center ${toast.bad?'bg-red-600 text-white':'bg-[#262626] text-[#f6d19c] border border-[#9c7229]'}`}>{toast.text}</div>}
    </div>
  );
}

const Spinner = () => <div className="p-12 text-center"><div className="w-8 h-8 border-4 border-[#9c7229] border-t-transparent spin rounded-full mx-auto"/></div>;

function Login({onLogin}){
  const [pin,setPin]=useState(''); const [err,setErr]=useState('');
  const submit=()=>{
    const p=pin.trim().toLowerCase();
    if(p===ADMIN_CODE) onLogin({role:'admin',name:'מנהל מערכת'});
    else if(AREA_MANAGERS[p]) onLogin({role:'manager',name:AREA_MANAGERS[p]});
    else { setErr('קוד שגוי, נסה שוב'); setPin(''); setTimeout(()=>setErr(''),3000); }
  };
  return (
    <div className="min-h-screen flex items-center justify-center p-6">
      <div className="bg-white p-8 rounded-[2rem] shadow-xl w-full max-w-[360px] text-center border-b-8 border-slate-200">
        <Logo className="h-12 mx-auto mb-6"/>
        <h1 className="text-[22px] font-black mb-5">כניסה למערכת</h1>
        <input type="password" value={pin} onChange={e=>setPin(e.target.value)} onKeyDown={e=>e.key==='Enter'&&submit()} placeholder="קוד כניסה" className="w-full text-center text-2xl py-3 bg-slate-50 border-2 rounded-xl mb-2 outline-none focus:border-[#9c7229]"/>
        {err && <p className="text-red-500 text-[15px] font-bold mb-2">{err}</p>}
        <button onClick={submit} className="w-full bg-[#262626] text-[#f6d19c] py-4 rounded-xl font-bold text-[17px] shadow-lg active:scale-95 transition mt-2">התחברות</button>
        <p className="text-[12px] text-slate-400 mt-6 pt-5 border-t">* כל הזכויות שמורות לקרדיבל פלוס בע״מ</p>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
